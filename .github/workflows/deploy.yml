name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* 는 빌드 시점에 번들로 인라인된다. CI에는 .env.local이 없어 GA4·애드센스 값이 비던 문제를 막는다.
      - name: Export public build env from wrangler.jsonc
        run: node scripts/write-public-env.mjs

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
