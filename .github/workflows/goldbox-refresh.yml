name: Refresh Goldbox

on:
  schedule:
    # UTC: 07:35, 08:05, 12:05 and 18:05 Asia/Seoul.
    - cron: '35 22 * * *'
    - cron: '5 23 * * *'
    - cron: '5 3 * * *'
    - cron: '5 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldbox-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh and inspect Goldbox coverage
        shell: bash
        run: |
          # 2026-11-09: 쿠팡 API 일시 연결 오류(network, 상품 0개)는 몇 분 안에 회복된다(11/7·11/9).
          # 'ready'이고 상품이 1개 이상이 될 때까지 60초 간격으로 4번 확인하고, 그래도 안 되면 실패로 본다.
          for attempt in 1 2 3 4; do
            curl --fail --silent --show-error --location --max-time 45 \
              --retry 2 --retry-delay 15 \
              "https://proteinlab.kr/api/goldbox/health?attempt=${attempt}" -o /tmp/goldbox-health.json
            status="$(jq -r '.status' /tmp/goldbox-health.json)"
            count="$(jq -r '.sourceCount // 0' /tmp/goldbox-health.json)"
            if [ "$status" = "ready" ] && [ "$count" -gt 0 ]; then
              break
            fi
            echo "attempt ${attempt}: status=${status} sourceCount=${count} error=$(jq -r '.error' /tmp/goldbox-health.json)"
            if [ "$attempt" -lt 4 ]; then sleep 60; fi
          done
          jq -r '"checkedAt=\(.checkedAt) status=\(.status) source=\(.sourceCount) valid=\(.validCount) baseline=\(.dailyBaselineCount) matched=\(.matchedCount) verified=\(.verifiedCount) gap=\(.verifiedMissingFromApiCount)"' /tmp/goldbox-health.json
          if [ "$(jq -r '.status' /tmp/goldbox-health.json)" != "ready" ]; then
            echo "::error::Goldbox API unavailable: $(jq -r '.error' /tmp/goldbox-health.json)"
            exit 1
          fi
          if [ "$(jq -r '.sourceCount' /tmp/goldbox-health.json)" -eq 0 ]; then
            echo "::error::Goldbox API returned zero products; verify the source feed."
            exit 1
          fi
          if [ "$(jq -r '.suspiciousDrop' /tmp/goldbox-health.json)" = "true" ]; then
            echo "::error::Goldbox API product count dropped by more than 50% from today's first healthy response."
            exit 1
          fi
          if [ "$(jq -r '.verifiedMissingFromApiCount' /tmp/goldbox-health.json)" -gt 0 ]; then
            # 2026-11-11: web Goldbox offers are registered daily by the local task (daily-goldbox.mjs) and are
            # normally absent from the Partners API feed, so a gap is expected, not a failure (it failed every day 11/2~11/11).
            echo "::warning::Confirmed Coupang app/web offers are missing from the Partners API; verified fallback cards remain active until expiry."
          fi
          if [ "$(jq -r '.matchedCount' /tmp/goldbox-health.json)" -eq 0 ]; then
            echo "::warning::No registered ProteinLab products matched the API feed; this may be a genuinely empty day or a matching gap."
          fi
