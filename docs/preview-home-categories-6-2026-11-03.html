<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 카테고리 6개 시안</title>
<style>
  body{margin:0;background:#e9e6df;font-family:"Pretendard","Malgun Gothic",sans-serif;color:#14201A}
  .wrap{display:flex;gap:28px;flex-wrap:wrap;padding:20px}
  .phone{width:375px;background:#FAF8F3;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.12)}
  .cap{font-size:13px;font-weight:800;padding:10px 12px;background:#14201A;color:#fff}
  .hdr{height:52px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 14px;font-weight:900;color:#1F5A3D}
  .sec{padding:8px 10px 0}
  .note{font-size:11px;color:#5f6b61;padding:6px 12px 10px}
  .next{margin:10px;height:120px;border-radius:12px;background:#fff;border:1px dashed #c9c4b8;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px}
  .card{display:flex;align-items:center;justify-content:center;gap:3px;border:1px solid #E3E8E4;background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(20,32,26,.07);padding:6px 3px;min-width:0}
  .ico{width:30px;height:30px;border-radius:7px;overflow:hidden;flex-shrink:0}
  .ico img{width:100%;height:100%;object-fit:cover}
  .lb{font-size:12px;font-weight:800;letter-spacing:-.04em;line-height:1.15;white-space:nowrap}
  .ct{font-size:10px;font-weight:700;color:#1F5A3D;margin-top:2px}
  /* 현재(Codex): 3x2 */
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  /* A: 6칸 한 줄, 아이콘 위 글자 아래 */
  .g6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  .g6 .card{flex-direction:column;gap:2px;padding:6px 2px 5px}
  .g6 .ico{width:34px;height:34px}
  .g6 .lb{font-size:11.5px;text-align:center}
  .g6 .ct{margin-top:0;text-align:center}
  /* B: 가로 스크롤 한 줄(지금 카드 크기 유지) */
  .sc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .sc .card{flex:0 0 calc((100% - 16px)/4.6)}
</style></head><body>
